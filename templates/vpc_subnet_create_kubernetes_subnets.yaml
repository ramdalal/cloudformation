AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Creates three private Kubernetes subnets (10.0.115.0/24, 10.0.116.0/24,
  10.0.117.0/24) in VPC vpc-00f71706f98ac5b0b (eu-central-1) and associates
  each with the existing route table rtb-0cf35f035c6983309 (the route table
  currently used by the 10.0.112.0/24 subnet). Generated by the Global
  Infrastructure Agent on the user's behalf. NOTE: this account has no default
  VPC; the target is the VPC that holds the 10.0.112.0/24 subnet.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-00f71706f98ac5b0b
    Description: VPC in which to create the subnets.

  RouteTableId:
    Type: String
    Default: rtb-0cf35f035c6983309
    Description: Existing route table to associate with all three subnets (same as 10.0.112.0/24).

  AzA:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: eu-central-1a
    Description: Availability Zone for Kubernetes subnet A.

  AzB:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: eu-central-1b
    Description: Availability Zone for Kubernetes subnet B.

  AzC:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: eu-central-1c
    Description: Availability Zone for Kubernetes subnet C.

Resources:
  PrivateSubnetKubernetesA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 10.0.115.0/24
      AvailabilityZone: !Ref AzA
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: Private Subnet Kubernetes A

  PrivateSubnetKubernetesB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 10.0.116.0/24
      AvailabilityZone: !Ref AzB
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: Private Subnet Kubernetes B

  PrivateSubnetKubernetesC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: 10.0.117.0/24
      AvailabilityZone: !Ref AzC
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: Private Subnet Kubernetes C

  SubnetRouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetKubernetesA
      RouteTableId: !Ref RouteTableId

  SubnetRouteTableAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetKubernetesB
      RouteTableId: !Ref RouteTableId

  SubnetRouteTableAssociationC:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetKubernetesC
      RouteTableId: !Ref RouteTableId

Outputs:
  PrivateSubnetKubernetesAId:
    Description: Subnet ID for Private Subnet Kubernetes A (10.0.115.0/24)
    Value: !Ref PrivateSubnetKubernetesA

  PrivateSubnetKubernetesBId:
    Description: Subnet ID for Private Subnet Kubernetes B (10.0.116.0/24)
    Value: !Ref PrivateSubnetKubernetesB

  PrivateSubnetKubernetesCId:
    Description: Subnet ID for Private Subnet Kubernetes C (10.0.117.0/24)
    Value: !Ref PrivateSubnetKubernetesC
